[package]
name = "andesshield-api"
version = "2.0.0"
edition = "2024"
authors = ["Víctor Manzano"]
description = "Backend seguro en Rust (Axum + PostgreSQL 18) para AndesShield — Matriz de Riesgos de Ciberseguridad Multi-Empresa"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "cors"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
